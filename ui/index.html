<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08090d"><title>Xray Glass</title><link rel="stylesheet" href="./style.css"></head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div><div class="grid" aria-hidden="true"></div><div id="ripples" aria-hidden="true"></div><div class="cursor-glow" aria-hidden="true"></div>
  <header class="top"><button class="mode-orb glass" id="mode" aria-label="Mode"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 17h14M7 7l-3 5 3 5m10-10 3 5-3 5"/></svg><span>P</span><span>T</span></button><div class="top-actions"><button class="icon-btn glass" id="lang" title="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18m0-18a15 15 0 0 0 0 18"/></svg></button><button class="icon-btn glass" id="theme" title="Theme"><svg viewBox="0 0 24 24"><path d="M20 15.2A8.8 8.8 0 0 1 8.8 4 9 9 0 1 0 20 15.2Z"/></svg></button></div></header>
  <main id="app">
    <section class="page active" id="home"><div class="hero"><div class="status-line"><span class="status-dot"></span><span id="status">آماده</span><small id="active-name">بدون کانفیگ</small></div><button class="globe-wrap" id="connect" aria-label="Connect"><div class="globe"><div class="globe-shine"></div><div class="globe-lines"></div><div class="globe-core"></div><div class="globe-ring ring-a"></div><div class="globe-ring ring-b"></div><div class="globe-pulse"></div><svg class="globe-mark" viewBox="0 0 24 24"><path d="M2.5 12s3.4-6.2 9.5-6.2 9.5 6.2 9.5 6.2-3.4 6.2-9.5 6.2S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></div></button><div class="connection-meta"><span class="label" id="mode-label">P · PROXY</span><span class="divider"></span><span id="latency">— ms</span></div><div class="mini-stats"><div><b id="down">—</b><small>↓ Mbps</small></div><i></i><div><b id="up">—</b><small>↑ Mbps</small></div><i></i><div><b id="uptime">00:00</b><small>TIME</small></div></div><div class="current-card glass" id="select-active"><span class="protocol-chip">XR</span><div class="current-info"><b id="profile-title">انتخاب کانفیگ</b><small id="profile-subtitle">برای شروع، یک کانفیگ انتخاب کنید</small></div><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div></div></section>
    <section class="page" id="configs"><div class="page-heading"><div><span class="eyebrow">LIBRARY</span><h1>کانفیگ‌ها</h1></div><div class="toolbar"><button class="icon-btn glass" id="ping" title="Ping all"><svg viewBox="0 0 24 24"><path d="M2 12h4l3-8 5 16 3-8h5"/></svg></button><button class="icon-btn glass" id="refresh" title="Refresh subscriptions"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.5-3"/></svg></button><button class="add-btn" id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div class="search glass"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" placeholder="جستجو" autocomplete="off"></div><div id="profile-list" class="profile-list"></div><div class="empty glass" id="empty"><div class="empty-orbit"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></div><b>کانفیگی نیست</b><small>یک پیوند یا subscription اضافه کنید</small><button class="outline-btn" id="empty-add">افزودن</button></div></section>
    <section class="page" id="settings"><div class="page-heading"><div><span class="eyebrow">PREFERENCES</span><h1>تنظیمات</h1></div></div><div class="settings-scroll"><div class="setting-card glass"><div class="setting-title"><span class="setting-icon red"><svg viewBox="0 0 24 24"><path d="m12 3 9 16H3L12 3Z"/><path d="M12 9v4m0 3h.01"/></svg></span><div><b id="core-label">هسته</b><small id="core-version">Xray —</small></div></div><button class="small-action" id="update">بررسی</button></div><div class="setting-card glass"><div class="setting-title"><span class="setting-icon cyan"><svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"/></svg></span><div><b id="dns-title">DNS</b><small>DoH · Xray resolver</small></div></div><input class="inline-input" id="dns" value="https://1.1.1.1/dns-query" aria-label="DNS"></div><div class="setting-card glass"><div class="setting-title"><span class="setting-icon mint"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8m-8 4h8m-8 4h3"/></svg></span><div><b id="route-title">مسیر</b><small id="route-note">دامنه‌های ایران مستقیم</small></div></div><select id="route" class="inline-select"><option value="ir">IR · DIRECT</option><option value="global">GLOBAL</option></select></div><button class="setting-card glass clickable" id="speed"><span class="setting-title"><span class="setting-icon violet"><svg viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0M12 14l4-5m-7 9h6"/></svg></span><span><b id="speed-title">تست سرعت</b><small>Cloudflare · <span id="speed-result">— Mbps</span></small></span></span><svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><button class="setting-card glass clickable danger" id="clear"><span class="setting-title"><span class="setting-icon red"><svg viewBox="0 0 24 24"><path d="M4 7h16m-10 4v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></span><span><b id="clear-title">حذف همه</b><small id="clear-note">کانفیگ‌ها و subscriptionها</small></span></span><svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><div class="version-line"><span>XRAY GLASS</span><span>0.1.0</span></div></div></section>
  </main>
  <nav class="dock glass" id="dock"><button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/></svg><span>settings</span></button><button data-page="configs"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h4"/></svg><span>configs</span></button><button data-page="home" class="selected"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg><span>home</span></button><i class="dock-indicator"></i></nav>
  <div class="modal-backdrop" id="modal"><div class="modal glass"><div class="modal-head"><b id="modal-title">افزودن</b><button id="close-modal" class="icon-btn"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="modal-tabs"><button data-tab="paste" class="active">Paste</button><button data-tab="sub">Sub</button><button data-tab="manual">Manual</button></div><div class="modal-body" id="tab-paste"><label>URI · JSON · Base64<textarea id="paste-input" rows="5" placeholder="vless://…"></textarea></label><button class="primary-btn" id="clipboard">Paste clipboard</button><button class="primary-btn" id="import">افزودن</button></div><div class="modal-body hidden" id="tab-sub"><label><span id="sub-name-label">نام</span><input id="sub-name" placeholder="Subscription"></label><label><span id="sub-url-label">پیوند</span><input id="sub-url" placeholder="https://…"></label><button class="primary-btn" id="save-sub">ذخیره</button></div><div class="modal-body hidden" id="tab-manual"><label><span id="manual-kind-label">پروتکل</span><select id="manual-kind"></select></label><label><span id="manual-name-label">نام</span><input id="manual-name" placeholder="Config"></label><div class="manual-fields"><label><span>HOST</span><input id="manual-host" placeholder="server.example"></label><label><span>PORT</span><input id="manual-port" inputmode="numeric" placeholder="443"></label><label><span>USER / ID</span><input id="manual-user" placeholder="UUID"></label><label><span>PASS / KEY</span><input id="manual-secret" placeholder="••••••" type="password"></label></div><label><span id="manual-uri-label">URI · JSON · Base64</span><textarea id="manual-uri" rows="4" placeholder="vless://…"></textarea></label><button class="primary-btn" id="save-manual">ذخیره</button></div></div></div><div class="toast" id="toast"></div><script type="module" src="./app.js"></script>
</body></html>
