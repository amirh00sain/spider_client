[package]
name = "xray-glass"
version = "0.1.0"
description = "Minimal Xray desktop client"
authors = ["Xray Glass"]
edition = "2021"

[lib]
name = "xray_glass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["process", "sync", "time", "net", "io-util"] }
dirs = "5"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
